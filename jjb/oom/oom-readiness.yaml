---
- project:
    name: oom-readiness-linters
    project: oom/readiness
    project-name: oom-readiness
    python-version: python3
    jobs:
      - oom-linters
    subproject:
      - "yaml":
          tox-dir: "./readiness-python"
          tox-envs: "yaml"
          pattern: "**/*.yaml"
      - "yml":
          tox-dir: "./readiness-python"
          tox-envs: "yaml"
          pattern: "**/*.yml"
      - "py":
          tox-dir: "./readiness-python"
          tox-envs: "python"
          pattern: "**/*.python"
    stream:
      - "master":
          branch: "master"

- project:
    name: oom-readiness-verify
    project-name: oom-readiness
    project: oom/readiness
    mvn-settings: "oom-settings"
    path: "."
    golangver: "golang123"
    build-node: ubuntu2204-docker-4c-4g
    jobs:
      - "{project-name}-{stream}-verify-golang"
    stream:
      - "master":
          branch: "master"

- project:
    name: oom-readiness-release
    project-name: oom-readiness
    project: oom/readiness
    mvn-settings: "oom-settings"
    jobs:
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
