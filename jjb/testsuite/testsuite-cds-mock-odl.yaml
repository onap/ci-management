---
- project:
    name: testsuite-cds-mock-odl-project-view
    project-name: testsuite-cds-mock-odl
    views:
      - project-view

- project:
    name: testsuite-cds-mock-odl-linters
    disable-job: true
    project: "testsuite/cds-mock-odl"
    project-name: "testsuite-cds-mock-odl"
    python-version: python3
    jobs:
      - integration-linters
    subproject:
      - "yaml":
          disable-job: false
          tox-dir: "."
          tox-envs: "yaml"
          pattern: "**/*.yaml"
      - "yml":
          tox-dir: "."
          tox-envs: "yaml"
          pattern: "**/*.yml"
      - "json":
          tox-dir: "."
          tox-envs: "json"
          pattern: "**/*.json"
      - "python":
          tox-dir: "."
          tox-envs: "py"
          pattern: "**/*.py"
      - "md":
          tox-dir: "."
          tox-envs: "md"
          pattern: "**/*.md"
    stream:
      - "master":
          branch: "master"
