---
- project:
    name: integration-simulators-ran-nssmf-simulator-project-view
    project-name: integration-simulators-ran-nssmf-simulator
    views:
      - project-view

- project:
    name: integration-simulators-ran-nssmf-simulator-linters
    disable-job: true
    project: integration/simulators/ran-nssmf-simulator
    project-name: integration-simulators-ran-nssmf-simulator
    python-version: python3
    jobs:
      - integration-linters
    subproject:
      - "yaml":
          disable-job: false
          tox-dir: "."
          tox-envs: "yaml"
          pattern: "**/*.yaml"
      - "yml":
          tox-dir: "."
          tox-envs: "yaml"
          pattern: "**/*.yml"
      - "json":
          tox-dir: "."
          tox-envs: "json"
          pattern: "**/*.json"
      - "python":
          tox-dir: "."
          tox-envs: "py"
          pattern: "**/*.py"
      - "md":
          tox-dir: "."
          tox-envs: "md"
          pattern: "**/*.md"
    stream:
      - "master":
          branch: "master"
