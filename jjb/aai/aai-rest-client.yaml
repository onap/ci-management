---
- project:
    name: aai-rest-client-project-view
    project-name: aai-rest-client
    views:
      - project-view

- project:
    name: aai-rest-client-master
    project-name: "aai-rest-client"
    jobs:
      - "{project-name}-{stream}-verify-java"
      - "{project-name}-{stream}-merge-java"
      - gerrit-maven-stage:
          sign-artifacts: true
          build-node: ubuntu2204-docker-4c-4g
          maven-versions-plugin: true
          sbom-generator: true
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    project: "aai/rest-client"
    stream:
      - "master":
          branch: "master"
    mvn-settings: "aai-rest-client-settings"
    files: "**"
    archive-artifacts: ""
    mvn-version: "mvn36"
    maven-version: "mvn36"
    java-version: openjdk21
    build-node: ubuntu2204-builder-4c-4g
