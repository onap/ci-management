---
- project:
    name: multicloud-openstack-vmware-java
    disable-job: true
    project-name: "multicloud-openstack-vmware"
    project: "multicloud/openstack/vmware"
    stream:
      - "master":
          branch: "master"
    mvn-settings: "multicloud-openstack-vmware-settings"
    subproject:
      - "vio":
          pom: "vio/pom.xml"
          pattern: "vio/**"
    jobs:
      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          build-node: centos8-docker-4c-4g
          maven-versions-plugin: true
      - gerrit-maven-docker-stage:
          sbom-generator: true
          build-node: ubuntu1804-docker-8c-8g
          maven-goals: install
          mvn-params: "-P docker"
          maven-versions-plugin: true
          container-public-registry: "nexus3.onap.org:10001"
          container-staging-registry: "nexus3.onap.org:10003"
      - "{project-name}-{stream}-verify-java":
          disable-job: false
      - "{project-name}-{stream}-merge-java"
      - "{project-name}-{stream}-{subproject}-verify-java"
      - "{project-name}-{stream}-{subproject}-merge-java"
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    files: "**"
    archive-artifacts: ""
    build-node: ubuntu1804-builder-4c-4g
    disabled: true

- project:
    name: multicloud-openstack-vmware-java-clm
    disable-job: true
    jobs:
      - gerrit-maven-clm
    nexus-iq-namespace: "onap-"
    project: multicloud/openstack/vmware
    project-name: "multicloud-openstack-vmware"
    build-node: "ubuntu1804-builder-4c-4g"
    stream:
      - "master":
          branch: "master"
    mvn-settings: "multicloud-openstack-vmware-settings"
    disabled: true
