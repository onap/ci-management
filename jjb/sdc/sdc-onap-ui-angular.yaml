---
# The verify and merge pipelines for this repository have migrated to
# GitHub Actions (see .github/workflows/gerrit-verify.yaml and
# gerrit-merge.yaml in sdc/onap-ui-angular). The Jenkins verify-java and
# merge-java jobs are therefore removed as duplicates: verify-java only ran
# `npm run build` + `npm run storybook:build` (no tests), which the GHA
# verify now reproduces and extends with a Jest suite and coverage, and
# merge-java attempted a Maven `deploy` of this Angular/TypeScript library
# to the Nexus releases repo instead of the npm registry that consumers
# actually resolve from. The GHA merge workflow replaces it with the correct
# model (npm snapshot on every merge, npm release gated on a releases/ file).
# The SonarCloud job is retained until equivalent scanning is added to the
# GitHub Actions workflows.
- project:
    name: sdc-onap-ui-project-view
    project-name: sdc-onap-ui
    views:
      - project-view

- project:
    name: sdc-onap-ui-angular-sonar
    jobs:
      - gerrit-maven-sonar
    sonarcloud: true
    sonarcloud-project-organization: "{sonarcloud_project_organization}"
    sonarcloud-project-key: "{sonarcloud_project_organization}_{project-name}"
    sonar-mvn-goal: "{sonar_mvn_goal}"
    build-node: ubuntu1804-builder-4c-4g
    project: "sdc/onap-ui-angular"
    project-name: "sdc-onap-ui-angular"
    branch: "master"
    mvn-settings: "sdc-onap-ui-angular-settings"
    mvn-params: "-Dsonar.branch={branch}"
    mvn-goals: "clean install"
    mvn-opts: "-Xmx1024m"
