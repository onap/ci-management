---
- project:
    name: cps-ncmp-dmi-plugin-project-view
    project-name: cps-ncmp-dmi-plugin
    views:
      - project-view

- project:
    name: cps-ncmp-dmi-plugin-java17
    java-version: openjdk17
    mvn-version: mvn36
    maven-version: mvn36
    project-name: cps-ncmp-dmi-plugin
    project: cps/ncmp-dmi-plugin
    mvn-snapshot-id: "ecomp-snapshots"
    nexus-snapshot-repo: "snapshots"
    jobs:
      - gerrit-maven-docker-verify:
          container-public-registry: nexus3.onap.org:10001
      - gerrit-maven-merge
      - gerrit-maven-stage:
          sign-artifacts: true
          build-node: centos8-docker-8c-8g
          maven-versions-plugin: true
          sbom-generator: true
      - gerrit-maven-docker-stage:
          build-node: centos8-docker-8c-8g
          maven-versions-plugin: true
          mvn-params: -Pdocker
          container-public-registry: nexus3.onap.org:10001
          container-staging-registry: nexus3.onap.org:10003
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    stream:
      - "paris":
          branch: "paris"
    mvn-settings: cps-ncmp-dmi-plugin-settings
    files: "**"
    archive-artifacts: ""
    build-node: centos8-docker-8c-8g

- project:
    name: cps-ncmp-dmi-plugin-java21
    java-version: openjdk21
    mvn-version: mvn39
    maven-version: mvn39
    project-name: cps-ncmp-dmi-plugin-java21
    project: cps/ncmp-dmi-plugin
    mvn-snapshot-id: "ecomp-snapshots"
    nexus-snapshot-repo: "snapshots"
    jobs:
      - gerrit-maven-docker-verify:
          container-public-registry: nexus3.onap.org:10001
      - gerrit-maven-merge
      - gerrit-maven-stage:
          sign-artifacts: true
          build-node: ubuntu2204-docker-8c-8g
          maven-versions-plugin: true
          sbom-generator: true
      - gerrit-maven-docker-stage:
          build-node: ubuntu2204-docker-8c-8g
          maven-versions-plugin: true
          mvn-params: -Pdocker
          container-public-registry: nexus3.onap.org:10001
          container-staging-registry: nexus3.onap.org:10003
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    stream:
      - "master":
          branch: master
    mvn-settings: cps-ncmp-dmi-plugin-settings
    files: "**"
    archive-artifacts: ""
    build-node: ubuntu2204-docker-8c-8g

- project:
    name: cps-ncmp-dmi-plugin-clm
    java-version: openjdk21
    mvn-version: mvn39
    maven-version: mvn39
    jobs:
      - gerrit-maven-clm
    nexus-iq-namespace: onap-
    project: cps/ncmp-dmi-plugin
    project-name: cps-ncmp-dmi-plugin
    branch: master
    mvn-settings: cps-ncmp-dmi-plugin-settings
    mvn-opts: "--add-opens=java.base/java.util=ALL-UNNAMED"
    build-node: ubuntu2204-docker-8c-8g

- project:
    name: cps-ncmp-dmi-plugin-sonar
    java-version: openjdk21
    mvn-version: mvn39
    maven-version: mvn39
    jobs:
      - gerrit-maven-sonar
    sonarcloud: true
    sonarcloud-project-organization: "{sonarcloud_project_organization}"
    sonarcloud-project-key: "{sonarcloud_project_organization}_{project-name}"
    sonarcloud-java-version: openjdk21
    sonar-mvn-goal: "{sonar_mvn_goal}"
    build-node: ubuntu2204-docker-8c-8g
    project: "cps/ncmp-dmi-plugin"
    project-name: "cps-ncmp-dmi-plugin"
    branch: "master"
    mvn-settings: "cps-ncmp-dmi-plugin-settings"
    mvn-goals: "clean install"

- project:
    name: cps-ncmp-dmi-plugin-sonar-verify
    java-version: openjdk21
    mvn-version: "mvn39"
    maven-version: "mvn39"
    jobs:
      - gerrit-maven-sonar-verify
    sonarcloud: true
    sonarcloud-project-organization: "{sonarcloud_project_organization}"
    sonarcloud-project-key: "{sonarcloud_project_organization}_{project-name}"
    sonarcloud-qualitygate-wait: true
    sonarcloud-java-version: openjdk21
    sonar-mvn-goal: "{sonar_mvn_goal}"
    build-node: ubuntu2204-docker-8c-8g
    project: "cps/ncmp-dmi-plugin"
    project-name: "cps-ncmp-dmi-plugin"
    branch: "master"
    mvn-settings: "cps-ncmp-dmi-plugin-settings"
    mvn-goals: "clean install"
