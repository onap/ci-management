---
- project:
    name: cps-project-view
    project-name: cps
    views:
      - project-view

- project:
    name: cps-java21
    java-version: openjdk21
    mvn-version: "mvn39"
    maven-version: "mvn39"
    project-name: "cps"
    project: "cps"
    jobs:
      # cps-master-verify-java is retired: the GitHub Actions lane
      # .github/workflows/gerrit-verify.yaml in the cps repository now
      # performs the Maven verify build for master, and votes Verified
      # back to Gerrit.
      #
      # cps-master-merge-java is retired: .github/workflows/gerrit-merge.yaml
      # in the cps repository now builds master on each merge and
      # publishes its Maven SNAPSHOTs to Nexus. That lane does not push
      # the per-merge snapshot container images the Jenkins job pushed
      # through Jib; a container lane is to follow.
      - gerrit-maven-stage:
          sign-artifacts: true
          build-node: ubuntu2204-docker-8c-8g
          maven-versions-plugin: true
          sbom-generator: true
      - gerrit-maven-docker-stage:
          build-node: ubuntu2204-docker-8c-8g
          maven-versions-plugin: true
          mvn-params: "-P cps-ncmp-docker"
          container-public-registry: "nexus3.onap.org:10001"
          container-staging-registry: "nexus3.onap.org:10003"
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    stream:
      - "master":
          branch: "master"
    mvn-settings: "cps-settings"
    files: "**"
    archive-artifacts: ""
    build-node: ubuntu2204-docker-8c-8g
