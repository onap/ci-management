---
- project:
    name: so-so-etsi-nfvo-project-view
    project-name: so-so-etsi-nfvo
    views:
      - project-view

- project:
    name: so-so-etsi-nfvo
    project-name: "so-so-etsi-nfvo"
    jobs:
      - "{project-name}-{stream}-verify-java"
      - "{project-name}-{stream}-merge-java"
      - gerrit-maven-stage:
          sbom-generator: true
          sign-artifacts: true
          build-node: ubuntu2204-docker-v1-8c-8g
          maven-versions-plugin: true
      - gerrit-maven-docker-stage:
          sbom-generator: true
          build-node: ubuntu2204-docker-v1-8c-8g
          maven-versions-plugin: true
          mvn-params: "-P docker -DskipTests"
          container-public-registry: "nexus3.onap.org:10001"
          container-staging-registry: "nexus3.onap.org:10003"
      - "{project-name}-gerrit-release-jobs":
          build-node: centos7-docker-2c-1g
    project: "so/so-etsi-nfvo"
    stream:
      - "master":
          branch: "master"
          java-version: openjdk21
          maven-version: mvn38
          mvn-version: mvn38
    mvn-settings: "so-so-etsi-nfvo-settings"
    files: "**"
    archive-artifacts: ""
    build-node: ubuntu2204-docker-v1-8c-8g
