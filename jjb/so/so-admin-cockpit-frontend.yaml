- job-template:
    name: "{project-name}-{stream}-verify-frontend"
    project-type: freestyle
    concurrent: true
    node: ubuntu2204-docker-v1-8c-8g
    properties:
      - infra-properties:
          build-days-to-keep: "{build-days-to-keep}"
    parameters:
      - infra-parameters:
          project: "{project}"
          branch: "{branch}"
          refspec: "refs/heads/{branch}"
          artifacts: "{archive-artifacts}"
    scm:
      - gerrit-trigger-scm:
          refspec: "$GERRIT_REFSPEC"
          choosing-strategy: gerrit
          submodule-recursive: "{submodule-recursive}"
    wrappers:
      - infra-wrappers:
          build-timeout: 40
    triggers:
      - gerrit-trigger-patch-submitted:
          server: "{server-name}"
          project: "{project}"
          branch: "{branch}"
          files: "**"
    builders:
      - lf-infra-pre-build
      - provide-maven-settings:
          global-settings-file: global-settings
          settings-file: "{mvn-settings}"
      - shell: !include-raw-escape: ../../shell/so-admin-cockpit-frontend.sh
    publishers:
      - junit:
          results: "**/test-results/**/*.xml"
          allow-empty-results: false
      - archive:
          artifacts: "**/coverage/**,**/test-results/**,**/playwright-report/**"
          allow-empty: true
          even-if-failed: true
      - lf-infra-publish
